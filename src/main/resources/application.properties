spring.application.name=api-gateway

# Port Number (Dynamic for Cloud/Render and fallback to 8080 locally)
server.port=${PORT:8080}

# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:https://fintrack-eurekaserver.onrender.com/eureka/}}
eureka.instance.prefer-ip-address=true

# Spring Cloud Gateway Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route 1: Auth Service Route
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 2: Category Service Route
spring.cloud.gateway.routes[1].id=category-service
spring.cloud.gateway.routes[1].uri=lb://CATEGORY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/categories/**

# Route 3: Transaction Service Route (handles Transactions, Income, and Expenses)
spring.cloud.gateway.routes[2].id=transaction-service
spring.cloud.gateway.routes[2].uri=lb://TRANSACTION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/transactions/**,/api/income/**,/api/expenses/**

# Route 4: Report Service Route
spring.cloud.gateway.routes[3].id=report-service
spring.cloud.gateway.routes[3].uri=lb://REPORT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/reports/**

# Route 5: Notification Route (hosted in Transaction Service)
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://TRANSACTION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

# Global CORS Configuration
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=https://fintrack-tau-teal.vercel.app,http://localhost:5173,http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,gateway

# JWT Security Configuration (shared secret with auth-service)
jwt.secret=${JWT_SECRET}
fintrack.internal.gateway-key=${INTERNAL_GATEWAY_KEY}
