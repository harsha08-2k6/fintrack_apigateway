server.port=${PORT:8080}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://fintrack-eurekaserver.onrender.com/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME:fintrack-apigateway.onrender.com}}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443
fintrack.internal.gateway-key=${INTERNAL_GATEWAY_KEY}
jwt.secret=${JWT_SECRET}
